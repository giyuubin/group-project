<!DOCTYPE html>
<html lang="ko">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content=
"width=device-width, initial-scale=1.0">

<title>

AI Malware Detector

</title>


<link
rel="stylesheet"
href=
"{{url_for(
'static',
filename='style.css')}}">

</head>


<body>


<div class="container">


<div class="logo">

🛡️

</div>


<h1>

AI Malware Detector

</h1>


<p class="subtitle">

EXE 파일을 업로드해
악성 여부를 분석합니다

</p>



<label
for="fileInput"
class="upload-box">


<div
class="upload-content"
id="uploadContent">


<div class="file-icon">

📄

</div>


<h2>

EXE 파일 선택

</h2>


<p>

파일을 드래그하거나
클릭하세요

</p>


</div>


</label>


<input
type="file"
id="fileInput"

onchange=
"previewFile()">



<button
onclick=
"uploadFile()">

🔍 분석 시작

</button>


<div id="result">

</div>


</div>


<script src=
"{{url_for(
'static',
filename='script.js')}}">

</script>


</body>
</html>
